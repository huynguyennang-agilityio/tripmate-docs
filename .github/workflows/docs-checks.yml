name: Docs checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the check
        run: python3 -m unittest discover -s scripts -v
      - name: Check document versions against main
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/check_versions.py --base "origin/${{ github.base_ref }}"
